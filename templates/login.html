<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Kependudukan Kabpaten/Kota</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <main class="main-content">
            <div class="login-box simple-login-box">
                <div class="login-header compact-header">
                    <div class="login-brand-title">
                        <span class="login-brand-icon"><i class="ti ti-database"></i></span>
                        <span class="login-brand-name">Selamat Datang di Tools Kependudukan Kota Yogyakarta</span>
                    </div>
                </div>

                <div class="login-form compact-form">
                    <form id="loginForm" action="{{ url_for('login_page') }}" method="post">
                        <div class="form-group">
                            <label for="username">
                                <span>Username</span>
                            </label>
                            <div class="input-icon-wrap">
                                <input 
                                    type="text" 
                                    id="username" 
                                    name="username" 
                                    placeholder="Masukkan username" 
                                    required 
                                    autocomplete="username"
                                    autofocus
                                >
                                <i class="ti ti-user input-icon"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">
                                <span>Password</span>
                            </label>
                            <div class="input-icon-wrap">
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    placeholder="Masukkan password" 
                                    required
                                    autocomplete="current-password"
                                >
                                <i class="ti ti-lock input-icon"></i>
                                <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan atau sembunyikan password">
                                    <i class="ti ti-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>

                        {% if error %}
                        <div class="login-error" role="alert"><i class="ti ti-alert-circle"></i> {{ error }}</div>
                        {% endif %}

                        <button type="submit" class="login-btn-submit" id="btnLogin">
                            Login
                        </button>

                        <div class="form-group">
                            <label class="link-label">
                                <a href="{{ url_for('penyajian_guest_page') }}" class="text-sm font-medium text-primary hover:underline">
                                    Penyajian Data DKB
                                </a>
                            </label>
                            <label class="link-label">
                                <a href="{{ url_for('index') }}"><i class="ti ti-arrow-left"></i> Kembali ke Beranda</a>
                            </label>
                        </div>

                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Toggle Password Visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');
        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');

        if (togglePassword && passwordInput && toggleIcon) {
            togglePassword.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                toggleIcon.className = isPassword ? 'ti ti-eye-off' : 'ti ti-eye';
            });
        }

        // Form Submit Feedback
        if (loginForm && btnLogin) {
            loginForm.addEventListener('submit', (e) => {
                btnLogin.disabled = true;
                btnLogin.innerHTML = '<span>Memverifikasi...</span> <i class="ti ti-loader animate-spin"></i>';
            });
        }
    </script>
</body>
</html>
